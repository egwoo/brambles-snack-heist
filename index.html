<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bramble's Snack Heist</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Gluten:wght@600;800&display=swap">
<style>
/* Layout: one full-bleed living map of Pinewhistle Lake; HUD notes pinned to its corners like a ranger's clipboard */
:root{
  --night:#132019;
  --panel:rgba(20,31,25,.9);
  --panel-solid:#1a2820;
  --panel-raise:#24372c;
  --ink:#f2eedf;
  --muted:#b3bea3;
  --line:rgba(242,238,223,.15);
  --moss:#9cc46b;
  --ember:#ffb24d;
  --shiny:#ffe27a;
  --danger:#ff7a66;
  --display:'Gluten','Trebuchet MS',ui-rounded,system-ui,sans-serif;
  --body:'Atkinson Hyperlegible',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:dark;
}
html{height:100%;box-sizing:border-box;overflow:hidden}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
body{height:100%;margin:0;background:var(--night);color:var(--ink);font:15px/1.45 var(--body);overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#app{position:relative;width:100%;height:100%;overflow:hidden;touch-action:none}
#world{position:absolute;inset:0;width:100%;height:100%;display:block}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--shiny);outline-offset:2px}

.hud{position:absolute;inset:0;pointer-events:none}
.hud-card{position:absolute;top:12px;left:max(16px,env(safe-area-inset-left,0px));display:grid;gap:8px;padding:10px 12px 11px;min-width:206px;max-width:calc(100% - 140px);background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:0 8px 26px rgba(0,0,0,.3)}
.clock{display:flex;align-items:center;gap:10px}
.clock canvas{width:30px;height:30px;flex:none}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.time{font-family:var(--display);font-weight:800;font-size:22px;line-height:1.05;font-variant-numeric:tabular-nums}
.meter{display:grid;grid-template-columns:40px 1fr;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
.bar{height:9px;border-radius:6px;background:rgba(242,238,223,.12);overflow:hidden}
.bar i{display:block;height:100%;width:0;border-radius:6px;background:linear-gradient(90deg,var(--ember),var(--moss));transition:width .25s}
.bar.low i{background:var(--danger)}
.counts{display:flex;gap:14px;align-items:center;font-size:14px;font-weight:700;font-variant-numeric:tabular-nums}
.counts span{display:inline-flex;align-items:center;gap:6px}
.ico-shiny{display:inline-block;width:9px;height:9px;background:var(--shiny);transform:rotate(45deg);border-radius:2px;box-shadow:0 0 8px rgba(255,226,122,.6);flex:none}
.ico-cone{display:inline-block;width:9px;height:12px;border-radius:50% 50% 46% 46%;background:repeating-linear-gradient(180deg,#a2703f 0 3px,#6f4a27 3px 5px);flex:none}
.craving{font-size:12px;color:var(--muted);max-width:240px}
.craving b{color:var(--ember)}
.craving.done b{color:var(--moss)}
.pouch{display:flex;gap:4px;flex-wrap:wrap;max-width:260px}
.slot{width:30px;height:30px;border-radius:8px;border:1px dashed rgba(242,238,223,.24);display:grid;place-items:center;background:rgba(242,238,223,.04)}
.slot.full{border-style:solid;border-color:rgba(242,238,223,.2);background:rgba(242,238,223,.1)}
.slot img{width:26px;height:26px;display:block}
.slot.incoming img{opacity:0}
.pouch{pointer-events:auto}
button.slot{padding:0;cursor:pointer}
button.slot:hover{border-color:var(--ember);background:rgba(255,178,77,.14)}
.chip.on{background:var(--moss);color:#16250d;border-color:transparent}
body.touch #btnTip{display:none}
.hover-tip{position:absolute;pointer-events:none}
.goals{list-style:none;margin:0;padding:8px 0 0;display:grid;gap:5px;border-top:1px solid var(--line);font-size:12.5px;max-width:250px}
.goals:empty{display:none}
.goals li{display:grid;grid-template-columns:14px 1fr;gap:7px;align-items:start;line-height:1.3}
.goals i{width:12px;height:12px;border-radius:4px;border:1.5px solid var(--muted);margin-top:2px}
.goals li.done{color:var(--muted);text-decoration:line-through}
.goals li.done i{background:var(--moss);border-color:var(--moss)}
.goals li.tut{color:var(--moss);font-weight:700}
.goals li.tut i{border-radius:50%;border-color:var(--moss);animation:pulse 1.4s infinite}
.goals em{font-style:normal;color:var(--ember);font-variant-numeric:tabular-nums}
@keyframes pulse{50%{box-shadow:0 0 0 4px rgba(156,196,107,.3)}}
.slider{display:grid;grid-template-columns:72px 1fr 40px;align-items:center;gap:12px;font-size:14px}
.slider output{color:var(--muted);font-variant-numeric:tabular-nums;text-align:right}
input[type=range]{accent-color:var(--ember);width:100%}
.recap{display:grid;gap:6px;margin:0;padding:0;list-style:none;font-size:14px}
.recap li{display:flex;justify-content:space-between;gap:12px;padding:8px 12px;border-radius:10px;background:rgba(242,238,223,.05);border:1px solid var(--line)}
.recap .ok{color:var(--moss);font-weight:700}
.recap .miss{color:var(--muted)}
#modal.top{z-index:35}
.pop{animation:pop .38s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.3)}100%{transform:scale(1)}}
.flyer{position:absolute;width:44px;height:44px;z-index:15;pointer-events:none;filter:drop-shadow(0 6px 8px rgba(0,0,0,.45))}
.hud-tr{position:absolute;top:12px;right:max(16px,env(safe-area-inset-right,0px));display:flex;gap:6px;pointer-events:auto}
.chip{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:8px 12px;border-radius:999px;border:1px solid var(--line);background:var(--panel);font-size:13px;font-weight:700;white-space:nowrap}
.chip:hover{background:var(--panel-raise)}
kbd{font:700 10px var(--body);padding:1px 5px;border:1px solid var(--line);border-radius:5px;color:var(--muted)}
.prompt{position:absolute;left:50%;bottom:22px;transform:translateX(-50%);padding:9px 16px;border-radius:999px;background:var(--panel);border:1px solid var(--line);font-weight:700;font-size:14px;white-space:nowrap;max-width:calc(100% - 32px);overflow:hidden;text-overflow:ellipsis}
.prompt.warn{color:var(--muted);font-weight:400}
.tag{position:absolute;left:50%;bottom:66px;transform:translateX(-50%);font-size:11px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;color:var(--moss);text-shadow:0 1px 4px rgba(0,0,0,.8)}
#toasts{position:absolute;top:60px;left:50%;transform:translateX(-50%);display:grid;gap:6px;justify-items:center;width:min(340px,calc(100% - 32px));pointer-events:none}
.toast{padding:8px 14px;border-radius:12px;background:var(--panel-solid);border:1px solid var(--line);font-size:14px;box-shadow:0 8px 20px rgba(0,0,0,.35);animation:tin .25s ease-out;text-align:center;transition:opacity .3s,transform .3s}
.toast.good{border-color:rgba(156,196,107,.55)}
.toast.danger{border-color:rgba(255,122,102,.65);color:#ffe0d9}
.toast.gold{border-color:rgba(255,226,122,.6)}
.toast.out{opacity:0;transform:translateY(-6px)}
@keyframes tin{from{opacity:0;transform:translateY(-8px)}}

.overlay{position:absolute;inset:0;display:grid;place-items:center;padding-block:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:rgba(9,15,12,.52);overflow:auto;z-index:20}
.panel{width:min(620px,100%);max-height:100%;overflow:auto;background:var(--panel-solid);border:1px solid var(--line);border-radius:22px;padding:22px;box-shadow:0 24px 60px rgba(0,0,0,.5);display:grid;gap:14px;align-content:start}
.panel h2{margin:0;font-family:var(--display);font-weight:800;font-size:32px;line-height:1.05;text-wrap:balance}
.panel h3{margin:0;font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.panel p{margin:0;max-width:62ch}
.sub{color:var(--muted)}
.small{font-size:13px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{padding:11px 18px;border-radius:12px;border:1px solid var(--line);background:var(--panel-raise);font-weight:700;display:inline-flex;align-items:center;gap:8px}
.btn:hover{filter:brightness(1.12)}
.btn.primary{background:var(--ember);color:#2b1a06;border-color:transparent}
.btn[disabled]{opacity:.45;cursor:not-allowed;filter:none}
.grid-snacks{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:8px}
.snack{display:grid;grid-template-columns:36px 1fr;gap:8px;align-items:center;padding:8px;border-radius:12px;background:rgba(242,238,223,.05);border:1px solid var(--line);text-align:left;min-width:0}
.snack img{width:36px;height:36px;display:block}
.snack .nm{font-weight:700;font-size:13px;line-height:1.2}
.snack .ct{font-size:12px;color:var(--muted)}
button.snack:hover{background:rgba(242,238,223,.11)}
.empty{padding:14px;border-radius:12px;border:1px dashed var(--line);color:var(--muted);font-size:14px}
.journal{display:grid;grid-template-columns:repeat(auto-fill,minmax(178px,1fr));gap:8px}
.jcard{display:grid;grid-template-columns:44px 1fr;gap:10px;align-items:start;padding:10px;border-radius:14px;background:rgba(242,238,223,.05);border:1px solid var(--line);min-width:0}
.jcard img{width:44px;height:44px;display:block}
.jcard .nm{font-weight:700;font-size:14px;line-height:1.2}
.jcard.locked .nm{color:var(--muted)}
.jcard .ht{font-size:12px;color:var(--muted);line-height:1.35;margin-top:2px}
.jcard.crave{border-color:rgba(255,178,77,.7);background:rgba(255,178,77,.08)}
.badge{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;padding:2px 6px;border-radius:6px;background:rgba(255,178,77,.2);color:var(--ember);margin-top:4px}
.wallet{display:inline-flex;align-items:center;gap:8px;font-weight:700}
.shop{display:grid;gap:8px;margin:0;padding:0;list-style:none}
.shop li{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;padding:10px 12px;border-radius:14px;background:rgba(242,238,223,.05);border:1px solid var(--line)}
.shop .nm{font-weight:700}
.shop .ds{font-size:13px;color:var(--muted)}
.shop .btn{min-width:86px;justify-content:center;font-variant-numeric:tabular-nums}
.keys{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:13px;margin:0}
.keys dt{font-weight:700;white-space:nowrap}
.keys dd{margin:0;color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:0}
.stats div{padding:10px;border-radius:12px;background:rgba(242,238,223,.05);border:1px solid var(--line)}
.stats dt{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.stats dd{margin:0;font-family:var(--display);font-weight:800;font-size:26px;font-variant-numeric:tabular-nums}

.title{width:min(760px,100%);display:grid;grid-template-columns:210px 1fr;gap:24px;align-items:center;background:var(--panel-solid);border:1px solid var(--line);border-radius:26px;padding:26px;box-shadow:0 24px 60px rgba(0,0,0,.5)}
.title canvas{width:210px;height:200px}
.title h1{font-family:var(--display);font-weight:800;font-size:clamp(40px,7vw,62px);line-height:.92;margin:0 0 10px;text-wrap:balance}
.title h1 span{color:var(--moss)}
.title p{margin:0 0 16px;color:var(--muted);max-width:52ch}
.title .row{margin-bottom:16px}
.place{font-size:11px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--ember);margin-bottom:6px}

#fade{position:absolute;inset:0;background:#060a08;opacity:0;pointer-events:none;z-index:30}

.touch{position:absolute;inset:0;pointer-events:none}
.stick{position:absolute;left:max(18px,env(safe-area-inset-left,0px));bottom:22px;width:132px;height:132px;border-radius:50%;background:rgba(20,31,25,.55);border:1px solid var(--line);pointer-events:auto;touch-action:none}
.knob{position:absolute;left:50%;top:50%;width:56px;height:56px;border-radius:50%;background:rgba(242,238,223,.22);border:1px solid rgba(242,238,223,.4);transform:translate(-50%,-50%)}
.tbtns{position:absolute;right:max(18px,env(safe-area-inset-right,0px));bottom:22px;display:grid;grid-template-columns:repeat(2,66px);gap:10px;pointer-events:auto}
.tb{height:52px;border-radius:16px;background:var(--panel);border:1px solid var(--line);font-weight:700;font-size:13px;touch-action:none}
.tb.big{grid-column:span 2;height:62px;background:var(--ember);color:#2b1a06;font-size:16px;border-color:transparent}
.tb.on{background:var(--moss);color:#16250d}
body.touch .prompt{bottom:226px}
body.touch .tag{bottom:268px}
body.touch #toasts{top:auto;bottom:300px}

@media (max-width:519px){ #btnMap{display:none} }
@media (max-width:640px){
  .hud-tr{flex-direction:column;align-items:flex-end}
  .hud-tr kbd{display:none}
  .hud-card{min-width:0;padding:8px 10px;gap:6px}
  .time{font-size:19px}
  .title{grid-template-columns:1fr;gap:8px;padding:20px}
  .title canvas{width:150px;height:143px}
  .goals li.done{display:none}
  .goals{font-size:12px;max-width:200px}
  .panel{padding:18px}
  .panel h2{font-size:27px}
  .stats dd{font-size:21px}
}
@media (prefers-reduced-motion:reduce){
  .toast{animation:none}
  .bar i{transition:none}
}
</style>

<div id="app">
  <canvas id="world" aria-label="Pinewhistle Lake campground"></canvas>

  <div id="hud" class="hud" hidden>
    <div class="hud-card">
      <div class="clock">
        <canvas id="sky" width="60" height="60"></canvas>
        <div><div id="dayLabel" class="eyebrow">Day 1</div><div id="timeLabel" class="time">8:00 am</div></div>
      </div>
      <div class="meter"><span>Belly</span><div id="bellyBar" class="bar"><i id="bellyFill"></i></div></div>
      <div class="counts">
        <span title="Shinies"><i class="ico-shiny"></i><span id="shinyCount">0</span></span>
        <span title="Pinecones"><i class="ico-cone"></i><span id="coneCount">0/3</span></span>
      </div>
      <div id="pouch" class="pouch" aria-label="Pouch"></div>
      <div id="craving" class="craving"></div>
      <ul id="goals" class="goals" aria-label="Goals"></ul>
    </div>
    <div class="hud-tr">
      <button id="btnTip" class="chip" type="button">Tiptoe <kbd>C</kbd></button>
      <button id="btnJournal" class="chip" type="button">Journal <kbd>J</kbd></button>
      <button id="btnMap" class="chip" type="button">Map <kbd>M</kbd></button>
      <button id="btnSound" class="chip" type="button">Sound on</button>
      <button id="btnPause" class="chip" type="button">Pause <kbd>Esc</kbd></button>
    </div>
    <div id="tag" class="tag" hidden>Tiptoeing</div>
    <div id="prompt" class="prompt" hidden></div>
    <div id="toasts" aria-live="polite"></div>
    <div id="touch" class="touch" hidden>
      <div id="stick" class="stick"><div id="knob" class="knob"></div></div>
      <div class="tbtns">
        <button id="tTip" class="tb" type="button">Tiptoe</button>
        <button id="tToss" class="tb" type="button">Toss</button>
        <button id="tEat" class="tb" type="button">Eat</button>
        <button id="tJournal" class="tb" type="button">Journal</button>
        <button id="tGrab" class="tb big" type="button">Grab</button>
      </div>
    </div>
  </div>

  <div id="titleScreen" class="overlay">
    <div class="title">
      <canvas id="hero" width="420" height="400"></canvas>
      <div>
        <div class="place">Pinewhistle Lake</div>
        <h1>Bramble's <span>Snack</span> Heist</h1>
        <p>Bramble is a shy moss troll who lives in the woods above the campground. The campers have the best snacks. Bramble would like the snacks. Sneak in, swipe them, and get home before anyone notices.</p>
        <div class="row">
          <button id="btnContinue" class="btn primary" type="button" hidden>Continue</button>
          <button id="btnNew" class="btn" type="button">New heist</button>
        </div>
        <dl id="titleKeys" class="keys"></dl>
      </div>
    </div>
  </div>

  <div id="modal" class="overlay" hidden><div id="panel" class="panel" role="dialog" aria-modal="true"></div></div>
  <div id="fade"></div>
</div>

<script>
(() => {
'use strict';
const $ = s => document.querySelector(s);
const TAU = Math.PI * 2, HALF = Math.PI / 2;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const rand = (a, b) => a + Math.random() * (b - a);
const pick = a => a[Math.floor(Math.random() * a.length)];
const dist = (ax, ay, bx, by) => Math.hypot(ax - bx, ay - by);
function angDiff(a, b) { let d = (b - a) % TAU; if (d > Math.PI) d -= TAU; else if (d < -Math.PI) d += TAU; return d; }
function hash2(x, y) { let h = (Math.imul(x | 0, 374761393) + Math.imul(y | 0, 668265263)) | 0; h = Math.imul(h ^ (h >>> 13), 1274126177); h ^= h >>> 16; return (h >>> 0) / 4294967296; }
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function inRange(h, a, b) { return a <= b ? (h >= a && h < b) : (h >= a || h < b); }
function segDist(px, py, ax, ay, bx, by) { const dx = bx - ax, dy = by - ay, l = dx * dx + dy * dy; const t = l ? clamp(((px - ax) * dx + (py - ay) * dy) / l, 0, 1) : 0; return Math.hypot(px - (ax + dx * t), py - (ay + dy * t)); }

// ---------- drawing helpers ----------
function circ(c, x, y, r, f) { c.beginPath(); c.arc(x, y, r, 0, TAU); c.fillStyle = f; c.fill(); }
function ell(c, x, y, rx, ry, f) { c.beginPath(); c.ellipse(x, y, Math.max(.1, rx), Math.max(.1, ry), 0, 0, TAU); c.fillStyle = f; c.fill(); }
function rrect(c, x, y, w, h, r) { r = Math.min(r, w / 2, h / 2); c.beginPath(); c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r); c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath(); }
function fillRR(c, x, y, w, h, r, f) { rrect(c, x, y, w, h, r); c.fillStyle = f; c.fill(); }
function tri(c, a, b, d, e, g, h, f) { c.beginPath(); c.moveTo(a, b); c.lineTo(d, e); c.lineTo(g, h); c.closePath(); c.fillStyle = f; c.fill(); }
function seg(c, a, b, d, e) { c.beginPath(); c.moveTo(a, b); c.lineTo(d, e); c.stroke(); }
function leaf(c, x, y, rx, ry, rot, f) { c.save(); c.translate(x, y); c.rotate(rot); ell(c, 0, 0, rx, ry, f); c.restore(); }
function shade(hex, amt) { const n = parseInt(hex.slice(1), 16); const r = clamp((n >> 16) + amt, 0, 255), g = clamp((n >> 8 & 255) + amt, 0, 255), b = clamp((n & 255) + amt, 0, 255); return `rgb(${r},${g},${b})`; }
function shadow(c, x, y, rx, ry) { ell(c, x + SUN.dx * rx * .5, y, rx * (1 + Math.abs(SUN.dx) * .35), ry, `rgba(16,28,12,${(.28 * SUN.a).toFixed(3)})`); }

// ---------- snacks ----------
const SNACKS = {
  berries:     { name: 'Wild Berries',        belly: 8,  hint: 'Low bushes in the woods near your den are full of them.' },
  apple:       { name: 'Crisp Apple',         belly: 12, hint: 'Something red hangs from the trees in the north meadow.' },
  sandwich:    { name: 'PB&J Sandwich',       belly: 25, hint: 'Campers keep lunch in the coolers beside their tents.' },
  watermelon:  { name: 'Watermelon Slice',    belly: 18, hint: 'Picnic baskets sit on the tables from 8 am to 8 pm.' },
  hotdog:      { name: 'Hot Dog',             belly: 25, hint: 'Ron grills hot dogs by the RV at lunch, 11 am to 2 pm.' },
  burger:      { name: 'Cheeseburger',        belly: 35, hint: 'Burgers only come off Ron’s grill at dinner, 5 to 8 pm.' },
  fish:        { name: 'Lake Trout',          belly: 22, hint: 'Gus fishes off the dock all day and keeps a bucket behind him.' },
  pie:         { name: 'Blueberry Pie',       belly: 40, hint: 'June cools a pie beside the RV from 10 am to 4 pm.' },
  marshmallow: { name: 'Toasted Marshmallow', belly: 15, hint: 'After 8 pm the campfire crowd toasts marshmallows.' },
  chips:       { name: 'Potato Chips',        belly: 15, hint: 'Crates stack up behind the Snack Shack while it’s open.' },
  donut:       { name: 'Glazed Donut',        belly: 20, hint: 'The ranger keeps a pink box on the cabin porch.' },
  pizza:       { name: 'Cold Pizza',          belly: 20, hint: 'Trash cans hide leftovers. The lids are loud.' },
};
const ORDER = Object.keys(SNACKS);

const ICON = {}, ICON_DIM = {};
function buildIcons() {
  for (const k of ORDER) {
    const cv = document.createElement('canvas'); cv.width = cv.height = 64;
    const c = cv.getContext('2d'); c.translate(32, 32); c.scale(2, 2); SNACK_DRAW[k](c);
    ICON[k] = cv.toDataURL();
    const s = document.createElement('canvas'); s.width = s.height = 64;
    const sc = s.getContext('2d'); sc.drawImage(cv, 0, 0); sc.globalCompositeOperation = 'source-in'; sc.fillStyle = 'rgba(242,238,223,.2)'; sc.fillRect(0, 0, 64, 64);
    ICON_DIM[k] = s.toDataURL();
  }
}

const DOCK = { x: 2405, y: 690, w: 50, h: 275 };
function inLake(x, y, shrink) { const dx = (x - LAKE.x) / (LAKE.rx - shrink), dy = (y - LAKE.y) / (LAKE.ry - shrink); return dx * dx + dy * dy < 1; }
function onDock(x, y) { return x >= DOCK.x + 5 && x <= DOCK.x + DOCK.w - 5 && y >= DOCK.y && y <= DOCK.y + DOCK.h + 20; }
function waterBlocked(x, y) { return inLake(x, y, 8) && !onDock(x, y); }

// forest
function treeOK(x, y) {
  for (const z of ZONES) if (x > z[0] && x < z[2] && y > z[1] && y < z[3]) return false;
  if (inLake(x, y, -90)) return false;
  if (nearPath(x, y, 34)) return false;
  for (const k of keepClear) if ((x - k.x) ** 2 + (y - k.y) ** 2 < k.r * k.r) return false;
  return true;
}
(function growForest() {
  const R = rng(20261030);
  const tr = sprites.filter(s => s.kind === 'tree');
  for (let i = 0; i < 4600 && tr.length < 720; i++) {
    const x = 30 + R() * (W - 60), y = 30 + R() * (H - 60);
    if (!treeOK(x, y)) continue;
    let ok = true;
    for (const t of tr) { const dx = t.x - x, dy = t.y - y; if (dx * dx + dy * dy < 4096) { ok = false; break; } }
    if (!ok) continue;
    tr.push(addTree(x, y, R() < .58 ? 'pine' : 'round', .85 + R() * .4));
  }

    else if (k === 'q') tossForward(); else if (k === 'm') toggleMap(); else if (k === 'c') toggleTiptoe();
  } else if (S.mode === 'title') {

addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });
const pad = { x: 0, y: 0, grab: false, tip: false }, padPrev = [];

  const btn = i => !!(gp.buttons[i] && gp.buttons[i].pressed);
  const hit = i => { const now = btn(i), was = padPrev[i]; padPrev[i] = now; return now && !was; };
  const ax = gp.axes[0] || 0, ay = gp.axes[1] || 0, m = Math.hypot(ax, ay);

  const a = hit(0), b = hit(1), x = hit(2), y = hit(3), st = hit(9);

  else if (!modal.hidden) {
    if (a) { const f = panel.contains(document.activeElement) && document.activeElement.tagName === 'BUTTON' ? document.activeElement : panel.querySelector('[data-autofocus]') || panel.querySelector('button'); if (f) f.click(); }
    else if ((b || st) && S.mode === 'menu') { if (modalKind === 'feast') renderDen('Feast complete. The pantry is all yours.'); else closeModal(); }

addEventListener('blur', () => { for (const k in keys) keys[k] = false; touchGrab = false; });

// mouse: hold left button to steer toward the cursor (close = tiptoe), click to walk or grab, right-click to toss
const mouse = { on: false, held: false, sx: 0, sy: 0, downT: 0, downX: 0, downY: 0, mark: null };
const screenToWorld = (sx, sy) => [view.x + sx / Z, view.y + sy / Z];

cv.addEventListener('pointerdown', e => {

  if (e.button === 2) { e.preventDefault(); const [wx, wy] = screenToWorld(lx, ly); toss(wx, wy); return; }

addEventListener('blur', () => { mouse.held = false; });
$('#btnJournal').onclick = () => { if (S.mode === 'play') openJournal(); };

const stick = $('#stick'), knob = $('#knob');

function moveStick(e) {

// ---------- title ----------
function drawHero() {
  const c = $('#hero').getContext('2d');
  c.clearRect(0, 0, 420, 400);
  const g = c.createRadialGradient(210, 230, 20, 210, 230, 200); g.addColorStop(0, 'rgba(156,196,107,.35)'); g.addColorStop(1, 'rgba(156,196,107,0)');
  c.fillStyle = g; c.fillRect(0, 0, 420, 400);
  drawBramble(c, 210, 330, HALF, time * .6, { scale: 5.4, pouch: 3 });
  for (const [k, x, y, s, r] of [['pie', 70, 120, 2.2, -.2], ['hotdog', 350, 110, 2, .3], ['donut', 360, 250, 1.9, 0], ['marshmallow', 60, 260, 2, .1]]) {
    c.save(); c.translate(x, y + Math.sin(time * 1.5 + x) * 6); c.rotate(r); c.scale(s, s); SNACK_DRAW[k](c); c.restore();
  }

function heroLoop() { if (S.mode === 'title') { drawHero(); requestAnimationFrame(heroLoop); } }

// ---------- boot ----------
function start(data) {

  const saved = data && data.save;

  requestAnimationFrame(t => { last = t; requestAnimationFrame(frame); });
}
const hot = window.claude && window.claude.hot;
if (hot && hot.snapshot) hot.snapshot(() => ({ save: snapshot(), playing: S.mode !== 'title', px: P.x, py: P.y }));
