<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bramble's Snack Heist</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Zilla+Slab:wght@500;600;700&display=swap">
<style>
/* Layout: one full-bleed living map; HUD pieces are routed wooden park signs, menus are printed park pamphlets */
:root{
  --ink:#1d2b33;
  --paper:#f3e7c9;
  --paper-2:#e9d9b2;
  --wood:#4a2e1d;
  --wood-line:#2b190e;
  --sun:#efb84a;
  --rust:#c8553d;
  --moss:#a9c26b;
  --pine:#2e5747;
  --ink-soft:#5b5546;
  --cream-dim:#d9c9a2;
  --display:'Alfa Slab One','Rockwell','Roboto Slab',Georgia,serif;
  --body:'Zilla Slab','Rockwell','Roboto Slab',Georgia,serif;
  --grain:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .12 0 0 0 0 .09 0 0 0 0 .05 0 0 0 .16 0'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
  --woodgrain:repeating-linear-gradient(177deg,rgba(255,240,210,.045) 0 2px,rgba(0,0,0,.08) 2px 7px,rgba(255,240,210,.02) 7px 11px);
  color-scheme:dark;
}
html{height:100%;box-sizing:border-box;overflow:hidden}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
body{height:100%;margin:0;background:var(--ink);color:var(--paper);font:500 15px/1.4 var(--body);overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#app{position:relative;width:100%;height:100%;overflow:hidden;touch-action:none}
#world{position:absolute;inset:0;width:100%;height:100%;display:block}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--sun);outline-offset:2px}

/* routed wooden park signs */
.hud-card,.chip,.prompt,.stick,.tb{background:var(--woodgrain),var(--grain),var(--wood);border:3px solid var(--wood-line);box-shadow:inset 0 0 0 2px rgba(243,231,201,.2),4px 4px 0 rgba(8,10,16,.5);color:var(--paper)}
.hud{position:absolute;inset:0;pointer-events:none}
.hud-card{position:absolute;top:12px;left:max(16px,env(safe-area-inset-left,0px));display:grid;gap:8px;padding:11px 13px 12px;min-width:216px;max-width:calc(100% - 150px);border-radius:10px}
.clock{display:flex;align-items:center;gap:10px}
.clock canvas{width:32px;height:32px;flex:none;border-radius:50%;box-shadow:0 0 0 2px var(--wood-line),0 0 0 4px rgba(243,231,201,.25)}
.eyebrow{font:700 11px/1.2 var(--body);letter-spacing:.16em;text-transform:uppercase;color:var(--cream-dim)}
.time{font:23px/1.05 var(--display);font-variant-numeric:tabular-nums;color:var(--paper)}
.meter{display:grid;grid-template-columns:42px 1fr;align-items:center;gap:8px;font:700 11px var(--body);letter-spacing:.12em;text-transform:uppercase;color:var(--cream-dim)}
.bar{height:10px;border-radius:2px;background:rgba(8,6,4,.45);box-shadow:inset 0 0 0 1px rgba(243,231,201,.25);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--sun);transition:width .25s}
.bar.low i{background:var(--rust)}
.counts{display:flex;gap:14px;align-items:center;font:700 15px var(--body);font-variant-numeric:tabular-nums}
.counts span{display:inline-flex;align-items:center;gap:6px}
.ico-shiny{display:inline-block;width:10px;height:10px;background:var(--sun);transform:rotate(45deg);box-shadow:0 0 0 1.5px var(--wood-line);flex:none}
.ico-cone{display:inline-block;width:9px;height:12px;border-radius:50% 50% 46% 46%;background:repeating-linear-gradient(180deg,#b07a46 0 3px,#6f4a27 3px 5px);flex:none}
.craving{font:600 13px var(--body);color:var(--cream-dim);max-width:250px}
.craving b{color:var(--sun);font-weight:700}
.craving.done b{color:var(--moss)}
.pouch{display:flex;gap:5px;flex-wrap:wrap;max-width:270px;pointer-events:auto}
.slot{width:32px;height:32px;border-radius:3px;border:2px dashed rgba(243,231,201,.3);display:grid;place-items:center;background:rgba(8,6,4,.25)}
.slot.full{border-style:solid;border-color:var(--wood-line);background:var(--paper)}
.slot img{width:27px;height:27px;display:block}
.slot.incoming img{opacity:0}
button.slot{padding:0;cursor:pointer}
button.slot:hover{border-color:var(--sun);background:#fff3d6}
.pop{animation:pop .38s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.3)}100%{transform:scale(1)}}
.flyer{position:absolute;width:44px;height:44px;z-index:15;pointer-events:none;filter:drop-shadow(3px 3px 0 rgba(8,10,16,.5))}
.goals{list-style:none;margin:0;padding:9px 0 0;display:grid;gap:6px;border-top:2px dashed rgba(243,231,201,.25);font:600 13px/1.3 var(--body);max-width:260px}
.goals:empty{display:none}
.goals li{display:grid;grid-template-columns:14px 1fr;gap:8px;align-items:start}
.goals i{width:12px;height:12px;border:2px solid var(--cream-dim);margin-top:2px}
.goals li.done{color:var(--cream-dim);text-decoration:line-through}
.goals li.done i{background:var(--moss);border-color:var(--moss)}
.goals li.tut{color:var(--moss);font-weight:700}
.goals li.tut i{border-radius:50%;border-color:var(--moss);animation:pulse 1.4s infinite}
.goals em{font-style:normal;color:var(--sun);font-variant-numeric:tabular-nums}
@keyframes pulse{50%{box-shadow:0 0 0 4px rgba(169,194,107,.35)}}
.hud-tr{position:absolute;top:12px;right:max(16px,env(safe-area-inset-right,0px));display:flex;gap:7px;pointer-events:auto}
.chip{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:7px 12px;border-radius:6px;border-width:2px;font:700 14px var(--body);white-space:nowrap}
.chip:hover{filter:brightness(1.18)}
.chip.on{background:var(--moss);color:var(--ink)}
body.touch #btnTip{display:none}
kbd{font:700 10px var(--body);padding:1px 5px;border:1px solid rgba(243,231,201,.4);border-radius:3px;color:var(--cream-dim)}
.prompt{position:absolute;left:50%;bottom:22px;transform:translateX(-50%);padding:9px 18px;border-radius:8px;font:700 15px var(--body);white-space:nowrap;max-width:calc(100% - 32px);overflow:hidden;text-overflow:ellipsis}
.prompt.warn{color:var(--cream-dim);font-weight:600}
.tag{position:absolute;left:50%;bottom:72px;transform:translateX(-50%);font:700 12px var(--body);letter-spacing:.18em;text-transform:uppercase;color:var(--paper);background:var(--pine);padding:3px 10px;border:2px solid var(--ink);box-shadow:3px 3px 0 var(--ink)}
#toasts{position:absolute;top:64px;left:50%;transform:translateX(-50%);display:grid;gap:8px;justify-items:center;width:min(360px,calc(100% - 32px));pointer-events:none}
.toast{padding:8px 14px;border-radius:3px;background:var(--grain),var(--paper);color:var(--ink);border:2px solid var(--ink);font:600 15px/1.3 var(--body);box-shadow:4px 4px 0 var(--ink);animation:tin .25s ease-out;text-align:center;transition:opacity .3s,transform .3s}
.toast.good{box-shadow:4px 4px 0 var(--pine)}
.toast.danger{box-shadow:4px 4px 0 var(--rust)}
.toast.gold{box-shadow:4px 4px 0 var(--sun)}
.toast.warn{box-shadow:4px 4px 0 var(--rust)}
.toast.out{opacity:0;transform:translateY(-6px)}
@keyframes tin{from{opacity:0;transform:translateY(-8px)}}

/* printed park pamphlets */
.overlay{position:absolute;inset:0;display:grid;place-items:center;padding-block:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:rgba(14,20,40,.58);overflow:auto;z-index:20}
.panel{width:min(620px,calc(100% - 10px));max-height:calc(100% - 10px);overflow:auto;background:var(--grain),var(--paper);color:var(--ink);border:3px solid var(--ink);border-radius:4px;padding:24px;box-shadow:9px 9px 0 var(--rust);display:grid;gap:14px;align-content:start}
.panel h2{margin:0;font:32px/1.05 var(--display);color:var(--ink);text-wrap:balance}
.panel h3{margin:0;font:700 12px/1.2 var(--body);letter-spacing:.16em;text-transform:uppercase;color:var(--rust);border-top:2px solid var(--ink);padding-top:10px}
.panel p{margin:0;max-width:62ch;font-size:16px}
.sub{color:var(--ink-soft)}
.small{font-size:14px!important}
.place{font:700 12px/1.2 var(--body);letter-spacing:.18em;text-transform:uppercase;color:var(--rust)}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.btn{padding:10px 18px;border-radius:3px;border:2px solid var(--ink);background:var(--paper-2);color:var(--ink);font:700 15px var(--body);display:inline-flex;align-items:center;gap:8px;box-shadow:3px 3px 0 var(--ink);transition:transform .08s,box-shadow .08s}
.btn:hover{transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--ink)}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.btn.primary{background:var(--rust);color:var(--paper)}
.btn[disabled]{opacity:.45;cursor:not-allowed;transform:none;box-shadow:3px 3px 0 var(--ink)}
.grid-snacks{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.snack,.jcard,.shop li,.stats div,.recap li,.empty{background:rgba(29,43,51,.05);border:2px solid rgba(29,43,51,.55);border-radius:3px}
.snack{display:grid;grid-template-columns:36px 1fr;gap:8px;align-items:center;padding:8px;text-align:left;min-width:0;color:var(--ink)}
.snack img{width:36px;height:36px;display:block}
.snack .nm{font-weight:700;font-size:14px;line-height:1.2}
.snack .ct{font-size:13px;color:var(--ink-soft)}
button.snack:hover{background:rgba(200,85,61,.12);border-color:var(--rust)}
.empty{padding:14px;color:var(--ink-soft);font-size:15px;border-style:dashed}
.journal{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:8px}
.jcard{display:grid;grid-template-columns:44px 1fr;gap:10px;align-items:start;padding:10px;min-width:0}
.jcard img{width:44px;height:44px;display:block}
.jcard .nm{font:700 15px/1.2 var(--body)}
.jcard.locked .nm{color:var(--ink-soft)}
.jcard .ht{font-size:13px;color:var(--ink-soft);line-height:1.35;margin-top:2px}
.jcard.crave{border-color:var(--rust);background:rgba(200,85,61,.1)}
.badge{display:inline-block;font:700 10px var(--body);letter-spacing:.12em;text-transform:uppercase;padding:2px 6px;background:var(--rust);color:var(--paper);margin-top:5px}
.wallet{display:inline-flex;align-items:center;gap:8px;font-weight:700}
.panel .ico-shiny{box-shadow:0 0 0 1.5px var(--ink)}
.shop{display:grid;gap:8px;margin:0;padding:0;list-style:none}
.shop li{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;padding:10px 12px}
.shop .nm{font-weight:700;font-size:16px}
.shop .ds{font-size:14px;color:var(--ink-soft)}
.shop .btn{min-width:88px;justify-content:center;font-variant-numeric:tabular-nums}
.keys{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14px;margin:0}
.keys dt{font-weight:700;white-space:nowrap}
.keys dd{margin:0;color:var(--ink-soft)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:0}
.stats div{padding:10px}
.stats dt{font:700 11px var(--body);letter-spacing:.14em;text-transform:uppercase;color:var(--ink-soft)}
.stats dd{margin:0;font:28px var(--display);font-variant-numeric:tabular-nums}
.recap{display:grid;gap:6px;margin:0;padding:0;list-style:none;font-size:15px}
.recap li{display:flex;justify-content:space-between;gap:12px;padding:8px 12px}
.recap .ok{color:var(--pine);font-weight:700}
.recap .miss{color:var(--ink-soft)}
.slider{display:grid;grid-template-columns:72px 1fr 44px;align-items:center;gap:12px;font-size:15px;font-weight:600}
.slider output{color:var(--ink-soft);font-variant-numeric:tabular-nums;text-align:right}
input[type=range]{accent-color:var(--rust);width:100%}
#modal.top{z-index:35}
.panel .meter{color:var(--ink-soft)}
.panel .bar{background:rgba(29,43,51,.12);box-shadow:inset 0 0 0 1.5px var(--ink)}

/* title poster */
.title-screen{background:rgba(14,20,40,.62)}
.title-wrap{display:grid;justify-items:center;gap:16px}
.poster{position:relative;height:min(calc(100vh - 200px),calc((100vw - 40px) * 4 / 3),660px);aspect-ratio:3/4;max-width:100%;border:4px solid var(--ink);box-shadow:10px 10px 0 var(--rust);overflow:hidden;background:var(--paper);container-type:size}
.poster canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.poster-head{position:absolute;top:6%;left:0;right:0;text-align:center;padding:0 6cqw}
.poster-kicker{font:700 3.6cqw/1.2 var(--body);letter-spacing:.24em;text-transform:uppercase;color:var(--p-rust,var(--rust))}
.poster h1{margin:2cqw 0 0;font:9cqw/.98 var(--display);color:var(--p-ink,var(--ink));text-shadow:.8cqw .6cqw 0 var(--p-sun,var(--sun));text-transform:uppercase;text-wrap:balance}
.poster h1 span{display:block;font-size:14.5cqw;line-height:.95}
.poster-foot{position:absolute;left:0;right:0;bottom:0;padding:2.6cqw 4cqw;background:var(--p-ink,var(--ink));color:var(--p-paper,var(--paper));font:700 3cqw/1.2 var(--body);letter-spacing:.13em;white-space:nowrap;text-transform:uppercase;text-align:center}
.title-actions{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.title-note{margin:0;font:600 14px var(--body);color:var(--cream-dim);text-align:center;max-width:46ch}

#fade{position:absolute;inset:0;background:#0b0f1c;opacity:0;pointer-events:none;z-index:30}

.touch{position:absolute;inset:0;pointer-events:none}
.stick{position:absolute;left:max(18px,env(safe-area-inset-left,0px));bottom:22px;width:132px;height:132px;border-radius:50%;pointer-events:auto;touch-action:none}
.knob{position:absolute;left:50%;top:50%;width:56px;height:56px;border-radius:50%;background:var(--paper);border:3px solid var(--ink);box-shadow:3px 3px 0 rgba(8,10,16,.5);transform:translate(-50%,-50%)}
.tbtns{position:absolute;right:max(18px,env(safe-area-inset-right,0px));bottom:22px;display:grid;grid-template-columns:repeat(2,68px);gap:10px;pointer-events:auto}
.tb{height:52px;border-radius:8px;font:700 14px var(--body);touch-action:none}
.tb.big{grid-column:span 2;height:62px;background:var(--rust);color:var(--paper);font-size:17px;border-color:var(--ink);box-shadow:4px 4px 0 var(--ink)}
.tb.on{background:var(--moss);color:var(--ink)}
body.touch .prompt{bottom:226px}
body.touch .tag{bottom:272px}
body.touch #toasts{top:auto;bottom:300px}

@media (max-width:519px){ #btnMap{display:none} }
@media (max-width:640px){
  .hud-tr{flex-direction:column;align-items:flex-end}
  .hud-tr kbd{display:none}
  .hud-card{min-width:0;padding:9px 11px;gap:6px}
  .time{font-size:20px}
  .panel{padding:18px;box-shadow:6px 6px 0 var(--rust)}
  .panel h2{font-size:27px}
  .stats dd{font-size:22px}
  .goals li.done{display:none}
  .goals{font-size:12.5px;max-width:200px}
}
@media (prefers-reduced-motion:reduce){
  .toast{animation:none}
  .bar i{transition:none}
  .btn{transition:none}
}
.testing #toasts,.testing #hud,.testing #touch,.testing #titleScreen{display:none!important}
#testReport{position:absolute;inset:0;z-index:99;margin:0;padding:16px;overflow:auto;background:#fff;color:#111;font:13px/1.45 ui-monospace,Menlo,monospace;white-space:pre-wrap}
</style>

<div id="app">
  <canvas id="world" aria-label="Pinewhistle Lake campground"></canvas>

  <div id="hud" class="hud" hidden>
    <div class="hud-card">
      <div class="clock">
        <canvas id="sky" width="60" height="60"></canvas>
        <div><div id="dayLabel" class="eyebrow">Day 1</div><div id="timeLabel" class="time">8:00 am</div></div>
      </div>
      <div class="meter"><span>Belly</span><div id="bellyBar" class="bar"><i id="bellyFill"></i></div></div>
      <div class="counts">
        <span title="Shinies"><i class="ico-shiny"></i><span id="shinyCount">0</span></span>
        <span title="Pinecones"><i class="ico-cone"></i><span id="coneCount">0/3</span></span>
      </div>
      <div id="pouch" class="pouch" aria-label="Pouch"></div>
      <div id="craving" class="craving"></div>
      <ul id="goals" class="goals" aria-label="Goals"></ul>
    </div>
    <div class="hud-tr">
      <button id="btnTip" class="chip" type="button">Tiptoe <kbd>C</kbd></button>
      <button id="btnJournal" class="chip" type="button">Journal <kbd>J</kbd></button>
      <button id="btnMap" class="chip" type="button">Map <kbd>M</kbd></button>
      <button id="btnSound" class="chip" type="button">Sound on</button>
      <button id="btnPause" class="chip" type="button">Pause <kbd>Esc</kbd></button>
    </div>
    <div id="tag" class="tag" hidden>Tiptoeing</div>
    <div id="prompt" class="prompt" hidden></div>
    <div id="toasts" aria-live="polite"></div>
    <div id="touch" class="touch" hidden>
      <div id="stick" class="stick"><div id="knob" class="knob"></div></div>
      <div class="tbtns">
        <button id="tTip" class="tb" type="button">Tiptoe</button>
        <button id="tToss" class="tb" type="button">Toss</button>
        <button id="tEat" class="tb" type="button">Eat</button>
        <button id="tJournal" class="tb" type="button">Journal</button>
        <button id="tGrab" class="tb big" type="button">Grab</button>
      </div>
    </div>
  </div>

  <div id="titleScreen" class="overlay title-screen">
    <div class="title-wrap">
      <div id="posterBox" class="poster">
        <canvas id="poster" aria-hidden="true"></canvas>
        <div class="poster-head">
          <div class="poster-kicker">Pinewhistle Lake Campground</div>
          <h1>Bramble's <span>Snack Heist</span></h1>
        </div>
        <div class="poster-foot">Sneak in &middot; Swipe snacks &middot; Get home unseen</div>
      </div>
      <div class="title-actions">
        <button id="btnContinue" class="btn primary" type="button" hidden>Continue</button>
        <button id="btnNew" class="btn" type="button">New heist</button>
      </div>
      <p class="title-note">Play with mouse, keyboard, touch or gamepad. Full controls are in the pause menu.</p>
    </div>
  </div>

  <div id="modal" class="overlay" hidden><div id="panel" class="panel" role="dialog" aria-modal="true"></div></div>
  <div id="fade"></div>
</div>

<script>
(() => {
'use strict';
const $ = s => document.querySelector(s);
const TAU = Math.PI * 2, HALF = Math.PI / 2;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const rand = (a, b) => a + Math.random() * (b - a);
const pick = a => a[Math.floor(Math.random() * a.length)];
const dist = (ax, ay, bx, by) => Math.hypot(ax - bx, ay - by);
function angDiff(a, b) { let d = (b - a) % TAU; if (d > Math.PI) d -= TAU; else if (d < -Math.PI) d += TAU; return d; }
function hash2(x, y) { let h = (Math.imul(x | 0, 374761393) + Math.imul(y | 0, 668265263)) | 0; h = Math.imul(h ^ (h >>> 13), 1274126177); h ^= h >>> 16; return (h >>> 0) / 4294967296; }
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
// test mode (?test, driven by tests/run.sh): every random roll comes from a fixed seed and nothing is saved
const TEST = (() => { try { const q = new URLSearchParams(location.search); return q.has('test') ? { seed: +q.get('seed') || 7, shot: q.get('shot'), scene: q.get('scene'), sim: q.has('sim'), gaps: q.has('gaps'), blind: false } : null; } catch (e) { return null; } })();
if (TEST) Math.random = rng(TEST.seed);
function inRange(h, a, b) { return a <= b ? (h >= a && h < b) : (h >= a || h < b); }
function segDist(px, py, ax, ay, bx, by) { const dx = bx - ax, dy = by - ay, l = dx * dx + dy * dy; const t = l ? clamp(((px - ax) * dx + (py - ay) * dy) / l, 0, 1) : 0; return Math.hypot(px - (ax + dx * t), py - (ay + dy * t)); }

// ---------- drawing helpers ----------
function circ(c, x, y, r, f) { c.beginPath(); c.arc(x, y, r, 0, TAU); c.fillStyle = f; c.fill(); }
function ell(c, x, y, rx, ry, f) { c.beginPath(); c.ellipse(x, y, Math.max(.1, rx), Math.max(.1, ry), 0, 0, TAU); c.fillStyle = f; c.fill(); }

const ICON = {}, ICON_DIM = {};
function buildIcons() {

  for (const k of ORDER) {
    const a = canvasOf(), ac = a.getContext('2d'); ac.translate(30, 30); ac.scale(2, 2); SNACK_DRAW[k](ac);
    const sh = canvasOf(), sc = sh.getContext('2d'); sc.drawImage(a, 0, 0); sc.globalCompositeOperation = 'source-in'; sc.fillStyle = DAYK.ink; sc.fillRect(0, 0, 64, 64);
    const out = canvasOf(), oc = out.getContext('2d'); oc.drawImage(sh, 3, 2.5); oc.drawImage(a, 0, 0);

const LAKE = { x: 2600, y: 560, rx: 560, ry: 400 };
const DOCK = { x: 2405, y: 690, w: 50, h: 275 };
function inLake(x, y, shrink) { const dx = (x - LAKE.x) / (LAKE.rx - shrink), dy = (y - LAKE.y) / (LAKE.ry - shrink); return dx * dx + dy * dy < 1; }
function onDock(x, y) { return x >= DOCK.x + 5 && x <= DOCK.x + DOCK.w - 5 && y >= DOCK.y && y <= DOCK.y + DOCK.h + 20; }
// Whisper Creek leaves the lake's south shore, pools behind a beaver dam, then runs off the south edge of the map
const CREEK = [[2800, 926], [2822, 1010], [2836, 1110], [2806, 1215], [2790, 1322]];
const CREEK2 = [[2830, 1530], [2774, 1640], [2794, 1760], [2750, 1900], [2774, 2040], [2724, 2200], [2756, 2320], [2736, 2440]];
const POND = [[2830, 1420, 142, 96], [2752, 1372, 84, 62], [2912, 1458, 88, 70]];
const BRIDGE = { x: 2834, y: 1100 }, DAM = { x: 2830, y: 1518 };
// Whisper Falls: the creek drops over a rock ledge into a deep plunge pool; stepping stones cross the lip
const FALLS = { x: 2755, y: 2100 }, PLUNGE = { x: 2744, y: 2168, rx: 70, ry: 40 };
function inPlunge(x, y, shrink) { const dx = (x - PLUNGE.x) / (PLUNGE.rx - shrink), dy = (y - PLUNGE.y) / (PLUNGE.ry - shrink); return dx * dx + dy * dy < 1; }
function inPond(x, y, shrink) { for (const [px, py, rx, ry] of POND) { const dx = (x - px) / (rx - shrink), dy = (y - py) / (ry - shrink); if (dx * dx + dy * dy < 1) return true; } return false; }
function creekDist(x, y) {
  let d = 1e9;
  for (const L of [CREEK, CREEK2]) for (let i = 0; i < L.length - 1; i++) d = Math.min(d, segDist(x, y, L[i][0], L[i][1], L[i + 1][0], L[i + 1][1]));
  return d;
}
const onBridge = (x, y) => Math.abs(x - BRIDGE.x) < 46 && Math.abs(y - BRIDGE.y) < 17;
const onDam = (x, y) => Math.abs(x - DAM.x) < 66 && Math.abs(y - DAM.y) < 17;
const onLedge = (x, y) => Math.abs(x - FALLS.x) < 50 && Math.abs(y - FALLS.y) < 12;
const inCreek = (x, y) => creekDist(x, y) < 17 && !onBridge(x, y) && !onDam(x, y) && !onLedge(x, y) && !inLake(x, y, 0);
function waterBlocked(x, y) { return (inLake(x, y, 8) && !onDock(x, y)) || (inPond(x, y, 6) && !onDam(x, y)) || inPlunge(x, y, 6) || (Math.abs(x - FALLS.x) < 40 && y > FALLS.y + 12 && y < PLUNGE.y); }

// forest
function treeOK(x, y) {
  for (const z of ZONES) if (x > z[0] && x < z[2] && y > z[1] && y < z[3]) return false;
  if (inLake(x, y, -90)) return false;
  if (nearPath(x, y, 34)) return false;
  if (inPond(x, y, -60) || inPlunge(x, y, -80) || creekDist(x, y) < 44) return false;
  for (const k of keepClear) if ((x - k.x) ** 2 + (y - k.y) ** 2 < k.r * k.r) return false;
  return true;
}
function grove(x, y) {
  const gx = x / 520, gy = y / 520, ix = Math.floor(gx), iy = Math.floor(gy), fx = gx - ix, fy = gy - iy, sx = fx * fx * (3 - 2 * fx), sy = fy * fy * (3 - 2 * fy);
  return lerp(lerp(hash2(ix, iy), hash2(ix + 1, iy), sx), lerp(hash2(ix, iy + 1), hash2(ix + 1, iy + 1), sx), sy);
}
const KC0 = keepClear.length;

  const tr = sprites.filter(s => s.kind === 'tree');

    const x = 30 + R() * (W - 60), y = 30 + R() * (H - 60);
    if (!treeOK(x, y)) continue;
    let ok = true;
    for (const t of tr) { const dx = t.x - x, dy = t.y - y; if (dx * dx + dy * dy < 4096) { ok = false; break; } }
    if (!ok) continue;
    // birches crowd the damp ground along Whisper Creek, the south woods are old growth, and now and then a dead snag
    const r = R(), wet = creekDist(x, y) < 300 || inPond(x, y, -200), old = y > 1960 && x > 760 && x < 2620;
    const type = wet && r < .6 ? 'birch' : r > .975 ? 'snag' : grove(x, y) + (R() - .5) * .35 > .48 ? 'pine' : 'round';
    tr.push(addTree(x, y, type, (.85 + R() * .4) * (old && type === 'round' ? 1.22 : 1)));
  }
  // a wall of woods past the south edge, seen when the touch camera scrolls past the map to clear the on-screen controls
  for (let row = 0; row < 5; row++) for (let x = -20 + row * 29; x < W + 40; x += 58) {
    const y = H + 26 + row * 76 + hash2(x | 0, row) * 40;
    addSprite({ kind: 'tree', type: hash2(x | 0, row + 5) > .45 ? 'pine' : 'round', x: x + hash2(row, x | 0) * 24, y, s: .95 + hash2(x | 0, row + 9) * .4, sortY: y });
  }
})();

const WARY = { theft: 1, chase: 1.2, latch: 3, patrol: 5, cool: .5, watch: .15, slow: 1.7 };

// ---------- NPC behaviour ----------
function taskAt(n, h) { for (const t of n.sched) if (inRange(h, t.from, t.to)) return t; return n.sched[0]; }

    const p = n.path[n.pi], dx = p.x - n.x, dy = p.y - n.y, d = Math.hypot(dx, dy);

}

    else if (t.kind === 'patrol') { n.pidx = Math.floor(Math.random() * t.pts.length); n.x = t.pts[n.pidx][0]; n.y = t.pts[n.pidx][1]; n.wait = rand(1, 3); n.lkT = 0; }

      else { n.dir = n.dirT = t.face; n.sitting = !!t.sit; n.glT = rand(1, 4); n.vT = t.trip ? rand(...t.trip) : 0; }

        if (t.still === 5) flag(`stuck${k}@${Math.round(h)}`, `${n.name} is stuck at ${Math.round(n.x)},${Math.round(n.y)} (${hm(h)})`);
      }
    });
    for (let a = 0; a < npcs.length; a++) for (let b = a + 1; b < npcs.length; b++) {
      const A = npcs[a], B = npcs[b], j = a * npcs.length + b;
      if (!A.inside && !B.inside && dist(A.x, A.y, B.x, B.y) < 16) { close[j] += dt; if (close[j] > 3) flag(`pile${j}@${Math.round(h)}`, `${A.name} and ${B.name} are standing in each other at ${Math.round(A.x)},${Math.round(A.y)} (${hm(h)})`); }
      else close[j] = 0;
    }
  }
  report([out.length ? `${out.length} problem(s) in one simulated day (6 am to 2 am):` : 'No problems: everyone reached every stop, nobody got stuck or walked through water or walls.', ...out, '', 'Arrivals (stop, set off, minutes to get there):', ...npcs.map((n, k) => `  ${n.name}: ${T[k].log.join(' · ') || 'no fixed stops'}`)]);
}
function testGaps() {
  const marks = [...AREAS, ...BEACONS], R = 560, trot = 152, out = [];
  const inView = (x, y) => marks.some(m => dist(x, y, m.x, m.y) < R);
  out.push(`Landmarks within ${R} px count as in view. Bramble trots ${trot} px/s, so 30 s is about ${30 * trot} px.`, '', 'Longest stretch of each trail with nothing in view:');
  PATHS.forEach(p => {
    let run = 0, best = 0, bx = 0, by = 0;
    for (let i = 0; i < p.pts.length - 1; i++) {
      const [ax, ay] = p.pts[i], [qx, qy] = p.pts[i + 1], n = Math.ceil(dist(ax, ay, qx, qy) / 16);
      for (let s = 0; s < n; s++) { const x = lerp(ax, qx, s / n), y = lerp(ay, qy, s / n); run = inView(x, y) ? 0 : run + dist(ax, ay, qx, qy) / n; if (run > best) { best = run; bx = x; by = y; } }
    }
    const sec = Math.round(best / trot);
    out.push(`  ${sec > 30 ? 'TOO LONG' : 'ok      '} ${String(sec).padStart(3)} s  trail from ${p.pts[0].join(',')} to ${p.pts[p.pts.length - 1].join(',')}${best ? `, ends near ${Math.round(bx)},${Math.round(by)}` : ''}`);
  });
  const G = 80, cols = Math.ceil(W / G), rows = Math.ceil(H / G), dead = new Uint8Array(cols * rows);
  for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) { const x = c * G + G / 2, y = r * G + G / 2; dead[r * cols + c] = !waterBlocked(x, y) && !inView(x, y) ? 1 : 0; }
  const blobs = [], seenC = new Uint8Array(cols * rows);
  for (let i = 0; i < dead.length; i++) {
    if (!dead[i] || seenC[i]) continue;
    const st = [i], cells = []; seenC[i] = 1;
    while (st.length) { const j = st.pop(); cells.push(j); const c = j % cols, r = (j - c) / cols; for (const [dc, dr] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) { const cc = c + dc, rr = r + dr, q = rr * cols + cc; if (cc >= 0 && rr >= 0 && cc < cols && rr < rows && dead[q] && !seenC[q]) { seenC[q] = 1; st.push(q); } } }
    const cx = cells.reduce((s, j) => s + (j % cols), 0) / cells.length * G + G / 2, cy = cells.reduce((s, j) => s + Math.floor(j / cols), 0) / cells.length * G + G / 2;
    blobs.push({ n: cells.length, cx, cy });
  }
  blobs.sort((a, b) => b.n - a.n);
  const total = dead.reduce((s, v) => s + v, 0);
  out.push('', `Woods with no landmark in view: ${Math.round(total / dead.length * 100)}% of the map. Biggest patches:`);
  for (const b of blobs.slice(0, 6)) out.push(`  ${String(Math.round(b.n * G * G / 10000)).padStart(4)} (100 px)² around ${Math.round(b.cx)},${Math.round(b.cy)}`);
  report(out);
}
function runTest() {
  resetState(); S.tut = TUT.length; S.goals = []; tutT = 99;
  if (TEST.shot || TEST.sim || TEST.gaps) {
    document.body.classList.add('testing');
    if (TEST.shot) testShot(TEST.shot); else if (TEST.sim) testSim(); else testGaps();
    return;
  }
  restock(); spawnShinies(); pickCraving(); placeNPCs(); beginPlay(false);
  // a handle for poking at the game from the console: bramble.go('mill'), bramble.hour(19.5)
  window.bramble = {
    S, P, npcs, loot, bushes, shaken, FEEL, AREAS, BEACONS, RANGER_ROUTE, newDay,
    go(id, dx = 0, dy = 70) { const a = AREAS.find(q => q.id === id) || { x: id, y: dx }; const f = nearestFree(cellOf(a.x + (a.x === id ? 0 : dx)), rowOf(a.y + (a.x === id ? 0 : dy))); P.x = f[0] * CELL + 16; P.y = f[1] * CELL + 16; P.goal = null; updateCamera(0, true); },
    hour(h) { S.hour = h; dark = darkAt(h); placeNPCs(); },
    blind(on = true) { TEST.blind = on; },
    // run the game for `sec` seconds at a fixed 30 fps, holding `held` keys (e.g. 'a', 'shift', ' '), then draw one frame;
    // works even when the page is in the background and animation frames are paused
    step(sec, held = []) { for (const k of held) keys[k] = true; for (let i = 0; i < Math.round(sec * 30); i++) { const dt = 1 / 30; time += dt; if (S.mode === 'play') update(dt); updateFX(dt); updateCamera(dt, false); } for (const k of held) keys[k] = false; render(); return { x: Math.round(P.x), y: Math.round(P.y), hour: +S.hour.toFixed(2) }; },
  };
  requestAnimationFrame(t => { last = t; requestAnimationFrame(frame); });
}

// ---------- boot ----------
function start(data) {
  resize(); buildIcons(); buildTextures(); drawSky(8);
  if (TEST) { runTest(); return; }
  const saved = data && data.save;
  if (saved && data.playing) { applySave(saved); restock(); spawnShinies(); if (!S.craving) pickCraving(); placeNPCs(); beginPlay(false, data.px, data.py); }
  else showTitle();
  requestAnimationFrame(t => { last = t; requestAnimationFrame(frame); });
}
const hot = window.claude && window.claude.hot;
if (hot && hot.snapshot) hot.snapshot(() => ({ save: snapshot(), playing: S.mode !== 'title', px: P.x, py: P.y }));
if (hot && hot.ready) hot.ready(start); else start((hot && hot.data) || {});
})();
</script>
